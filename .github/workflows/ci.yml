name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-check:
    name: Static portfolio integrity check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -s index.html
          test -s km-logo.png
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8', errors='ignore').lower()
          assert '<html' in html, 'index.html does not contain an <html> element'
          assert '</html>' in html, 'index.html is missing </html>'
          print('Static portfolio checks passed.')
          PY
